name: Test & Publish Docker Image

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: pg-backup-restore-cli
  PG_CONTAINER: pg-test
  TEST_DB: testdb

jobs:
  # Web UI unit tests and frontend build.
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm (version from ui/package.json packageManager)
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

  # CLI and web UI integration tests against a real PostgreSQL container.
  test:
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build CLI image
        run: docker build -t ${{ env.IMAGE_NAME }}:test .

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name ${{ env.PG_CONTAINER }} \
            -e POSTGRES_PASSWORD=postgres \
            postgres:17-alpine

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker exec ${{ env.PG_CONTAINER }} pg_isready -U postgres -q; then
              echo "PostgreSQL is ready."
              break
            fi
            sleep 2
          done

      # Each step mounts the Docker socket and the backups dir itself.
      # The CLI container can reach $PG_CONTAINER because both share the host Docker daemon
      - name: "[create] Create database"
        run: |
          mkdir -p ${{ github.workspace }}/backups
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            create -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}

      - name: "[create] Verify database exists"
        run: |
          docker exec ${{ env.PG_CONTAINER }} psql -U postgres -c "\l" | grep ${{ env.TEST_DB }}

      - name: "[export] Export database"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            export -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}

      - name: "[export] Verify dump file was created"
        run: |
          ls ${{ github.workspace }}/backups/${{ env.TEST_DB }}_*.sql | head -1
          echo "Dump files found:"
          ls -lh ${{ github.workspace }}/backups/

      - name: "[unblock] Terminate connections"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.IMAGE_NAME }}:test \
            unblock -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}

      - name: "[delete] Drop database"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.IMAGE_NAME }}:test \
            delete -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}

      - name: "[delete] Verify database no longer exists"
        run: |
          ! docker exec ${{ env.PG_CONTAINER }} psql -U postgres -c "\l" | grep ${{ env.TEST_DB }}

      - name: "[restore] Restore database from dump"
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            restore -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}

      - name: "[restore] Verify database is back"
        run: |
          docker exec ${{ env.PG_CONTAINER }} psql -U postgres -c "\l" | grep ${{ env.TEST_DB }}

      - name: "[restore] Seed a table and export it"
        run: |
          docker exec ${{ env.PG_CONTAINER }} psql -U postgres -d ${{ env.TEST_DB }} \
            -c "CREATE TABLE marker (id int); INSERT INTO marker VALUES (42);"
          rm -f ${{ github.workspace }}/backups/*.sql
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            export -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}

      - name: "[restore] Restore into a renamed database"
        run: |
          FILE=$(basename "$(ls ${{ github.workspace }}/backups/${{ env.TEST_DB }}_*.sql | head -1)")
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            restore -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}_copy -f "$FILE"
          docker exec ${{ env.PG_CONTAINER }} psql -U postgres -d ${{ env.TEST_DB }}_copy -tAc \
            "SELECT id FROM marker" | grep -x 42

      - name: "[restore] Refuse restore over non-empty database without -x"
        run: |
          FILE=$(basename "$(ls ${{ github.workspace }}/backups/${{ env.TEST_DB }}_*.sql | head -1)")
          if docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            restore -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}_copy -f "$FILE"; then
            echo "Expected restore over a non-empty database to fail"; exit 1
          fi

      - name: "[restore] Replace existing database with -x"
        run: |
          FILE=$(basename "$(ls ${{ github.workspace }}/backups/${{ env.TEST_DB }}_*.sql | head -1)")
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/backups:/backups \
            ${{ env.IMAGE_NAME }}:test \
            restore -c ${{ env.PG_CONTAINER }} -d ${{ env.TEST_DB }}_copy -x -f "$FILE"
          docker exec ${{ env.PG_CONTAINER }} psql -U postgres -d ${{ env.TEST_DB }}_copy -tAc \
            "SELECT count(*) FROM marker" | grep -x 1

      - name: "[help] Smoke-test help command"
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test --help

      - name: "[serve] Web UI refuses to start without credentials"
        run: |
          if timeout 30 docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.IMAGE_NAME }}:test serve; then
            echo "Expected the UI to refuse to start without BASIC_AUTH_*"; exit 1
          fi

      - name: "[serve] Smoke-test Web UI starts and enforces auth"
        env:
          AUTH: ci-user:ci-password
          URL: http://localhost:3000
        run: |
          docker run -d --name pg-ui-test \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e BASIC_AUTH_USER=ci-user \
            -e BASIC_AUTH_PASSWORD=ci-password \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:test serve
          echo "Waiting for UI to be ready..."
          for i in $(seq 1 20); do
            if curl -sf -u "$AUTH" http://localhost:3000/api/containers > /dev/null 2>&1; then
              echo "Web UI is up!"
              break
            fi
            sleep 2
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # API: 401 without or with wrong credentials (and no browser auth dialog)
          test "$(code "$URL/api/backups")" = 401
          test "$(code -u ci-user:wrong-password "$URL/api/backups")" = 401
          test "$(code -u ci-user:wrong-password "$URL/api/containers")" = 401
          if curl -sI "$URL/api/backups" | grep -qi '^www-authenticate'; then
            echo "API must not send WWW-Authenticate"; exit 1
          fi
          # API: 200 with valid Basic credentials (bootstrapped admin)
          test "$(code -u "$AUTH" "$URL/api/backups")" = 200
          curl -sf -u "$AUTH" "$URL/api/containers"
          curl -sf -u "$AUTH" "$URL/api/auth/me" | grep '"role":"admin"'
          # The SPA (login page is client-side) is public
          curl -sf "$URL/" | grep -i "PG Backup"
          curl -sf "$URL/login" | grep -i "PG Backup"
          docker rm -f pg-ui-test

      - name: Cleanup
        if: always()
        run: docker rm -f ${{ env.PG_CONTAINER }} || true

  # Runs only when the tests pass.
  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/cswni/${{ env.IMAGE_NAME }}
            cswni/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
