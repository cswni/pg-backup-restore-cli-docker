services:
  pg-backup-restore:
    image: ghcr.io/cswni/pg-backup-restore-cli:latest
    #image: cswni/pg-backup:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      # Seeds the first admin account on first start only. Afterwards users are
      # managed in the UI and changing these does NOT change existing passwords.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD must be set}
      # Encrypts stored credentials (SSH keys, DB passwords, cloud tokens).
      # Keep it safe and never change it, or stored credentials become unreadable.
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      # Public https URL of this UI (Google Drive OAuth redirect, links in notifications)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Default timezone for new backup schedules
      TZ: ${TZ:-UTC}
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.id == $NODE_ID
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-net
        - traefik.constraint-label=traefik-local
        - traefik.http.routers.pg-backup-restore.rule=Host(`pgui.zionode.com`)
        - traefik.http.routers.pg-backup-restore.entrypoints=https
        - traefik.http.routers.pg-backup-restore.tls=true
        - traefik.http.routers.pg-backup-restore.tls.certresolver=le
        - traefik.http.services.pg-backup-restore.loadbalancer.server.port=3000
        - traefik.http.services.pg-backup-restore.loadbalancer.server.scheme=http
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
